name: CI

# The verification gate this repo never had. `desktop-release.yml` only fires
# on tags and only builds installers, so until now nothing checked a PR.
#
# Scope note: the Playwright suite is NOT run here. Its config is already
# CI-aware (it expects the job to start the frontend itself), but it also
# needs the backend running with TEST_AUTH_ENABLED, which is a full-stack job
# of its own. Vitest is what gates PRs today.

on:
  # No branch filter on `pull_request` on purpose. A stacked PR targets its
  # parent branch, not `dev`, and a `[dev, master]` filter silently skips it —
  # you get a PR page with no checks at all, which reads as "nothing to run"
  # rather than "nothing ran". Every PR is verified, whatever it targets.
  pull_request:
  push:
    branches: [dev, master]

# A second push to the same PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check below runs even if an earlier one failed, so a red build
      # reports all of its problems at once instead of one per push. The job
      # still fails if any single step does.
      #
      # Binaries are invoked from node_modules/.bin rather than through
      # `pnpm run`, matching how these gates are run locally: pnpm 11's
      # verify-deps preflight is known to misfire on this project and would
      # fail the step before the tool ever runs.
      - name: Lint
        if: ${{ !cancelled() }}
        run: node_modules/.bin/eslint .

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: node_modules/.bin/tsc --noEmit

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: node_modules/.bin/vitest run
