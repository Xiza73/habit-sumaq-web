name: Desktop Release

# Builds the Tauri desktop installers on real Windows + macOS runners and
# attaches them to a GitHub Release. A Windows `.exe`/`.msi` cannot be built
# from macOS, so cross-platform packaging must happen in CI.
#
# Trigger by pushing a tag like `desktop-v0.3.0` (kept separate from the web
# release flow, which deploys via Vercel on `master`). Can also be run manually.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: universal binary covers Apple Silicon + Intel.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Windows: NSIS `.exe` + WiX `.msi`.
          - platform: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        # The desktop app loads the deployed site remotely (frontendDist is a
        # URL), so there is NO frontend build step — this only installs the
        # Tauri CLI + JS plugins needed to package. None of the optional native
        # deps (sharp, msw, swc…) need their build scripts here.
        #
        # pnpm 11 treats un-approved build scripts as a HARD ERROR under CI
        # (ERR_PNPM_IGNORED_BUILDS → exit 1) even though the install succeeds.
        # `strict-dep-builds=false` downgrades it to a warning. This is scoped
        # to this command only — it does NOT touch pnpm-workspace.yaml, so the
        # Vercel web build is unaffected.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build and release desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Habit Sumaq Desktop ${{ github.ref_name }}'
          releaseBody: |
            Instaladores de escritorio de Habit Sumaq.

            - **Windows:** `.exe` (NSIS) / `.msi`
            - **macOS:** `.dmg` (universal — Apple Silicon + Intel)

            > Los instaladores no están firmados todavía: Windows SmartScreen y
            > macOS Gatekeeper mostrarán una advertencia en la primera apertura.
            > La firma de código es un paso posterior.
          releaseDraft: true
          args: ${{ matrix.args }}
