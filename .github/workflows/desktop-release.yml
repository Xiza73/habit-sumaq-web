name: Desktop Release

# Builds the Tauri desktop installers on real Windows + macOS runners and
# attaches them to a GitHub Release. A Windows `.exe`/`.msi` cannot be built
# from macOS, so cross-platform packaging must happen in CI.
#
# Trigger by pushing a tag like `desktop-v0.3.0` (kept separate from the web
# release flow, which deploys via Vercel on `master`). Can also be run manually.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # pnpm 11 aborts scripts under CI when dependencies have un-approved build
    # scripts (ERR_PNPM_IGNORED_BUILDS → exit 1), and it re-checks deps before
    # every `pnpm <script>` — including tauri-action's internal `pnpm tauri
    # build`. The desktop app loads the frontend remotely and needs no native
    # builds, so skip that pre-run check and don't treat ignored builds as
    # fatal. Scoped to this job via env — pnpm-workspace.yaml (and therefore the
    # Vercel web build) is untouched.
    env:
      # Skip pnpm's pre-run dependency check so tauri-action's internal
      # `pnpm tauri build` doesn't re-trigger the ignored-builds error.
      npm_config_verify_deps_before_run: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: universal binary covers Apple Silicon + Intel.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Windows: NSIS `.exe` + WiX `.msi`.
          - platform: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        # Loads the frontend remotely (frontendDist is a URL) — no frontend
        # build here, just the Tauri CLI + JS plugins needed to package.
        # `--config.strict-dep-builds=false` stops pnpm 11 from failing on the
        # un-approved (and unneeded) native build scripts under CI. Must be the
        # flag — the env-var form does not suppress it for an explicit install.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build and release desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Habit Sumaq Desktop ${{ github.ref_name }}'
          releaseBody: |
            Instaladores de escritorio de Habit Sumaq.

            - **Windows:** `.exe` (NSIS) / `.msi`
            - **macOS:** `.dmg` (universal — Apple Silicon + Intel)

            > Los instaladores no están firmados todavía: Windows SmartScreen y
            > macOS Gatekeeper mostrarán una advertencia en la primera apertura.
            > La firma de código es un paso posterior.
          releaseDraft: true
          args: ${{ matrix.args }}
