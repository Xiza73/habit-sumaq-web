name: Desktop Release

# Builds the Tauri desktop installers on real Windows + macOS runners and
# attaches them to a GitHub Release. A Windows `.exe`/`.msi` cannot be built
# from macOS, so cross-platform packaging must happen in CI.
#
# Triggers on:
#   - `v*` tags        → the app release cut from `master`; the installers ride
#     along, versioned to match the tag, so web + desktop stay aligned.
#   - `desktop-v*` tags → a desktop-only rebuild (native shell / icon changes)
#     between app releases.
# Both build installers whose version is synced from the tag. Also runnable
# manually (keeps the committed tauri.conf version in that case).
on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: universal binary covers Apple Silicon + Intel.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Windows: NSIS `.exe` + WiX `.msi`.
          - platform: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Make the installer's version match the release tag so web + desktop are
      # aligned. Accepts `v0.6.2` and `desktop-v0.6.2` → 0.6.2. Only on tag runs
      # with a valid semver; otherwise the committed tauri.conf version stands.
      - name: Sync app version to the release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's/^.*v//')"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Setting app version to $VERSION"
            node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n');"
          else
            echo "Tag '$GITHUB_REF_NAME' has no semver version; keeping tauri.conf version."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        # Loads the frontend remotely (frontendDist is a URL) — no frontend
        # build here, just the Tauri CLI + JS plugins needed to package.
        # `--config.strict-dep-builds=false` stops pnpm 11 from failing on the
        # un-approved (and unneeded) native build scripts under CI. Must be the
        # flag — the env-var form does not suppress it for an explicit install.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build and release desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## Instaladores de escritorio

            - **Windows:** `.exe` (NSIS) / `.msi`
            - **macOS:** `.dmg` (universal — Apple Silicon + Intel)

            > Los instaladores no están firmados todavía: Windows SmartScreen y
            > macOS Gatekeeper mostrarán una advertencia en la primera apertura.
            > La firma de código es un paso posterior.
          # Creates the GitHub Release as a DRAFT with the installers attached,
          # so `v*` (app) releases don't need a separate `gh release create` —
          # the tag push builds installers AND drafts the release to review.
          releaseDraft: true
          # Invoke the Tauri CLI directly with node — NOT through pnpm. Under
          # the CI pnpm (pnpm/action-setup), every pnpm invocation (run, exec,
          # even install) triggers a verify-deps check that re-hits
          # ERR_PNPM_IGNORED_BUILDS and aborts. Calling the CLI's JS entrypoint
          # with node removes pnpm from the build path entirely. Deps are
          # already installed by the step above. (Forward slashes work on
          # Windows node too.)
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          args: ${{ matrix.args }}
